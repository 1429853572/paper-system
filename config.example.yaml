# paper-system 配置（非敏感调优项；敏感项一律在 .env）
# 复制为 config.yaml 使用；缺省时程序内建默认值与下面一致

limits:
  tracker_subs: 5        # 每成员文献追踪订阅数上限
  # ---- member 默认限额（admin 全豁免；管理页可按用户微调） ----
  max_file_mb: 100          # 单文件大小上限
  max_pages: 500            # PDF 页数上限
  daily_parse_papers: 200   # 每用户日解析篇数
  translate_concurrency: 2  # 每用户翻译并发
  disk_quota_gb: 20         # 每用户磁盘配额

  # ---- 全局（保护 GPU，admin 也生效） ----
  global_daily_parse: 600   # 全局日解析产能上限

  # ---- SSE 并发连接上限（每标签页常驻 1 条，占一个线程池 token） ----
  sse_per_user: 4           # 每用户并发连接上限（多开标签页场景）
  sse_total: 200            # 全站上限（超限返回 429——防线程池打满整站假死）

scheduler:
  translate_workers: 4      # 翻译 worker 池总并发
  embed_backfill_batch: 32  # embedding 后台回填批大小（控 xinference 峰值显存）
  poll_interval_sec: 10     # 队列轮询间隔
  retry_max: 3              # 失败重试次数（指数退避）
  parse_task_timeout_sec: 1800  # 单个 MinerU 远程任务时长上限（秒）：卡 running 会占死唯一解析 worker

rag:
  chunk_tokens: 650
  overlap_tokens: 100
  fts_top_k: 15

qa:
  fulltext_max_tokens: 200000  # 全文直读预算（1M 上下文模型可全塞；小窗口模型改小自动降级检索）
  multi_paper_max: 10
  smart_top_sections: 3   # smart 模式喂入的命中章节数          # 跨论文对比上限
  context_char_budget: 90000   # 多篇拼接的字符预算（约1:1.5 token）

retention:
  trash_days: 30            # 回收站保留天数
  backup_keep: 7            # 备份保留份数

# ---- 可选：交叉编码器重排（xinference /v1/rerank）----
# 库规模小（<100篇）时双塔混合检索已足够；库大了再开，收益最明显
rerank:
  enabled: true
  base_url: http://xinference:9997
  model: bge-reranker-v2-m3
  top_n: 50          # 参与重排的候选数
  keep: 8            # 重排后保留
  timeout: 30
