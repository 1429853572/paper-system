<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-system · 登录</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
<div class="login-card">
  <h1><svg class="ic" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 13.5V3.5M6.3 13.5V3.5M9.6 13.5V3.5M2 13.5h12"/></svg> paper-system</h1>
  <p class="sub">学术论文阅读 · 翻译 · 问答</p>

  <div class="tabs">
    <button class="tab active" data-tab="login">登录</button>
    <button class="tab" data-tab="register">注册（需邀请码）</button>
  </div>

  <form id="login-form" class="pane active">
    <input type="text" name="username" placeholder="用户名" autocomplete="username" required>
    <input type="password" name="password" placeholder="密码" autocomplete="current-password" required>
    <div class="err" id="login-err"></div>
    <button type="submit" class="btn primary">登 录</button>
  </form>

  <form id="register-form" class="pane">
    <input type="text" name="invite_code" placeholder="邀请码" required>
    <input type="text" name="username" placeholder="用户名（2-32字符）" required>
    <input type="password" name="password" placeholder="密码（至少8位）" minlength="8" required>
    <input type="password" name="password2" placeholder="再输一次密码" required>
    <div class="err" id="reg-err"></div>
    <button type="submit" class="btn primary">注 册</button>
  </form>
</div>

<script src="/static/login.js"></script>
</body>
</html>
