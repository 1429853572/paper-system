<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-system · 登录</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
<div class="login-card">
  <h1>📚 paper-system</h1>
  <p class="sub">学术论文阅读 · 翻译 · 问答</p>

  <div class="tabs">
    <button class="tab active" data-tab="login">登录</button>
    <button class="tab" data-tab="register">注册（需邀请码）</button>
  </div>

  <form id="login-form" class="pane active">
    <input type="text" name="username" placeholder="用户名" autocomplete="username" required>
    <input type="password" name="password" placeholder="密码" autocomplete="current-password" required>
    <div class="err" id="login-err"></div>
    <button type="submit" class="btn primary">登 录</button>
  </form>

  <form id="register-form" class="pane">
    <input type="text" name="invite_code" placeholder="邀请码" required>
    <input type="text" name="username" placeholder="用户名（2-32字符）" required>
    <input type="password" name="password" placeholder="密码（至少8位）" minlength="8" required>
    <input type="password" name="password2" placeholder="再输一次密码" required>
    <div class="err" id="reg-err"></div>
    <button type="submit" class="btn primary">注 册</button>
  </form>
</div>

<script>
const $ = s => document.querySelector(s);
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('#' + t.dataset.tab + '-form').classList.add('active');
});
$('#login-form').onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const r = await fetch('/api/login', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: f.get('username'), password: f.get('password')})});
  if (r.ok) location.href = '/';
  else $('#login-err').textContent = (await r.json()).detail || '登录失败';
};
$('#register-form').onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (f.get('password') !== f.get('password2')) {
    $('#reg-err').textContent = '两次密码不一致'; return;
  }
  const r = await fetch('/api/register', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({invite_code: f.get('invite_code'),
      username: f.get('username'), password: f.get('password')})});
  if (r.ok) { location.href = '/'; }
  else $('#reg-err').textContent = (await r.json()).detail || '注册失败';
};
// 已登录直接进
fetch('/api/me').then(r => { if (r.ok) location.href = '/'; });
</script>
</body>
</html>
