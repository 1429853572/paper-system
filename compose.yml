services:
  mineru:
    image: mineru:4.1.6
    container_name: paper-system-mineru
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: ["mineru-kit"]
    command: ["api-server", "--host", "0.0.0.0", "--port", "8000"]
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # 统一本地 AI 服务：embedding(BGE-M3) + rerank(qwen3-reranker) 一个容器
  # 模型由 scripts/setup-xinference.sh 启动（server+worker，ModelScope 源）
  xinference:
    image: docker.1ms.run/xprobe/xinference:latest-cu129
    container_name: paper-system-xinference
    restart: unless-stopped
    ports: ["9997:9997"]
    volumes:
      - ./models/xinference:/root/.xinference/cache
    environment:
      XINFERENCE_HOME: /root/.xinference
      XINFERENCE_MODEL_SOURCE: modelscope
    command: ["xinference-local", "--host", "0.0.0.0", "--port", "9997"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9997/v1/models >/dev/null || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  app:
    image: papersys-app:v1
    build: ./app
    profiles: ["app"]
    container_name: paper-system-app
    restart: unless-stopped
    depends_on:
      mineru:
        condition: service_healthy
      xinference:
        condition: service_healthy
    ports: ["8001:8001"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      MINERU_BASE_URL: http://mineru:8000
      EMBED_BASE_URL: http://xinference:9997
      EMBED_MODEL_NAME: bge-m3
      RERANK_BASE_URL: http://xinference:9997
      RENDER_SERVICE_URL: http://host.docker.internal:8801/render
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./app:/app   # 代码挂载：更新=git pull + restart（镜像仍为可复现部署主载体）
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/api/health',timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m

  caddy:
    image: caddy:2.11.7-alpine   # 版本锁定
    profiles: ["app"]
    container_name: paper-system-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports: ["7861:7861"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
