x-logging: &default-logging
  driver: json-file
  options: {max-size: "50m", max-file: "3"}   # 无轮转会慢慢吃满磁盘（vLLM 日志尤其肥）

services:
  mineru:
    image: mineru:4.1.6
    container_name: paper-system-mineru
    restart: unless-stopped
    logging: *default-logging
    ports: ["127.0.0.1:8000:8000"]   # GPU API 无认证——只绑本机，外部经 caddy/app 访问
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: ["mineru-kit"]
    command: ["api-server", "--host", "0.0.0.0", "--port", "8000"]
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # 统一本地 AI 服务：embedding(BGE-M3) + rerank(bge-reranker-v2-m3) 一个容器
  # 模型由 scripts/setup-xinference.sh 启动（server+worker，ModelScope 源）
  xinference:
    image: docker.1ms.run/xprobe/xinference@sha256:da75082f4531c855e75bf3cce14ddcd0b0c1ffe2ae876ad51202177a6637671f   # 锁 digest（latest-cu129 迁移即漂移；本机已拉取此版本）
    container_name: paper-system-xinference
    restart: unless-stopped
    logging: *default-logging
    ports: ["127.0.0.1:9997:9997"]   # embedding/rerank 无认证——只绑本机
    volumes:
      - ./models/xinference:/root/.xinference/cache
    environment:
      XINFERENCE_HOME: /root/.xinference
      XINFERENCE_MODEL_SOURCE: modelscope
    command: ["xinference-local", "--host", "0.0.0.0", "--port", "9997"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9997/v1/models >/dev/null || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  app:
    image: papersys-app:v1
    build: ./app
    profiles: ["app"]
    container_name: paper-system-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mineru:
        condition: service_healthy
      xinference:
        condition: service_healthy
    ports: ["127.0.0.1:8001:8001"]   # web 入口统一走 caddy:7861
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      MINERU_BASE_URL: http://mineru:8000
      EMBED_BASE_URL: http://xinference:9997
      EMBED_MODEL_NAME: bge-m3
      RERANK_BASE_URL: http://xinference:9997
      RENDER_SERVICE_URL: http://host.docker.internal:8801/render
      # 宿主浏览器采集服务（中文文献获取；Playwright + 宿主 Chrome）
      ACQUIRE_SERVICE_URL: http://host.docker.internal:8802
      PAPERSYS_ACQUIRE_TOKEN: ${PAPERSYS_ACQUIRE_TOKEN:-}
      # 采集白名单（防 SSRF；两侧同源，改这里即可）
      CNKI_ALLOWED_HOSTS: ${CNKI_ALLOWED_HOSTS:-}
      # MCP 工具分组：read=只读；read,write 开放写工具（仍需网页确认+可撤销）
      PAPERSYS_MCP_TOOLSETS: ${PAPERSYS_MCP_TOOLSETS:-read}
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./app:/app   # 代码挂载：更新=git pull + restart（镜像仍为可复现部署主载体）
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/api/health',timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m

  caddy:
    image: caddy:2.11.7-alpine   # 版本锁定
    profiles: ["app"]
    container_name: paper-system-caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    ports: ["7861:7861", "80:80"]   # 80 = http://papers.local 局域网免端口访问
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
